name: hw26-efk

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1536m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  fluentd:
    image: hw26-fluentd:1.18.0-es5.4.3
    build: ./fluentd
    mem_limit: 384m
    volumes:
      - fluentd-buffer:/fluentd/log
    ports:
      - "127.0.0.1:24224:24224"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:24220/api/plugins.json')).is_a?(Net::HTTPSuccess) ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.23
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_SECURITY_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=768
    mem_limit: 1536m
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  app:
    image: hw26-node-app:1.0.0
    build: .
    environment:
      PORT: "10000"
    mem_limit: 256m
    ports:
      - "127.0.0.1:10000:10000"
    depends_on:
      fluentd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(10000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging:
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        tag: docker.node-app
        fluentd-async: "true"
        fluentd-async-reconnect-interval: "1s"
        fluentd-buffer-limit: "16384"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "2147483647"
        fluentd-sub-second-precision: "true"
        fluentd-write-timeout: "3s"
    restart: unless-stopped

volumes:
  es-data:
  fluentd-buffer:
