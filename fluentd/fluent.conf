<source>
  @type forward
  bind 0.0.0.0
  port 24224
</source>

<source>
  @type monitor_agent
  bind 127.0.0.1
  port 24220
</source>

# Docker wraps each stdout/stderr line in the log field.
<filter docker.node-app>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type json
    time_key timestamp
    time_type string
    time_format %iso8601
    keep_time_key true
  </parse>
</filter>

<match docker.node-app>
  @type elasticsearch
  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix node-app
  include_tag_key true
  tag_key docker_tag
  suppress_type_name true
  reconnect_on_error true
  reload_on_failure true
  <buffer tag>
    @type file
    path /fluentd/log/buffer/node-app
    flush_interval 2s
    chunk_limit_size 2m
    total_limit_size 128m
    retry_forever true
    retry_max_interval 30s
    overflow_action block
  </buffer>
</match>
